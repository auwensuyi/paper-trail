# Local Postgres with the pgvector extension, used from Milestone 2 onward.
# Start it with:  docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: papertrail
      POSTGRES_PASSWORD: papertrail   # local development only
      POSTGRES_DB: papertrail
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
